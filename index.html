<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Prospection"/>
<meta name="theme-color" content="#534AB7"/>
<title>Ma Prospection</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--p:#7F77DD;--pl:#EEEDFE;--pd:#3C3489;
--g:#1D9E75;--gl:#E1F5EE;--gd:#085041;
--a:#BA7517;--al:#FAEEDA;--ad:#633806;
--r:#E24B4A;--rl:#FCEBEB;--rd:#791F1F;
--bg:#fff;--bg2:#f5f5f7;--bg3:#ececec;
--tx:#111;--tx2:#666;--tx3:#999;
--bd:rgba(0,0,0,.12);--bd2:rgba(0,0,0,.2);
}
@media(prefers-color-scheme:dark){:root{
--bg:#111;--bg2:#1c1c1e;--bg3:#2c2c2e;
--tx:#fff;--tx2:#aaa;--tx3:#666;
--bd:rgba(255,255,255,.1);--bd2:rgba(255,255,255,.2);
--pl:#2a2660;--pd:#AFA9EC;
--gl:#0a2e20;--gd:#5DCAA5;
--al:#2e1e00;--ad:#EF9F27;
}}
html,body{height:100%;background:var(--bg3);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.app{display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.15)}

/* HERO */
.hero{position:relative;overflow:hidden}
.hero svg{display:block;width:100%}
.hero-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:env(safe-area-inset-top,16px) 20px 20px}
.progress-wrap{padding:0 0 12px}
.progress-label{display:flex;justify-content:space-between;margin-bottom:6px}
.progress-label span{font-size:12px;color:rgba(255,255,255,.85);font-weight:400}
.progress-label span:last-child{font-weight:600}
.progress-track{height:5px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:#fff;border-radius:3px;transition:width .6s ease}
.hero-greeting{font-size:12px;color:rgba(255,255,255,.8);margin-bottom:2px}
.hero-title{font-size:24px;font-weight:700;color:#fff;letter-spacing:-.3px}
.hero-badge{display:inline-block;margin-top:8px;background:rgba(255,255,255,.22);color:#fff;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px}
.hero-dots{position:absolute;top:14px;right:14px;display:flex;gap:5px}
.hdot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.4);cursor:pointer;transition:all .25s}
.hdot.active{width:18px;background:#fff}

/* TABS */
.tabs{display:flex;padding:12px 12px 0;gap:6px;background:var(--bg)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 12px;font-size:11px;font-weight:600;color:var(--tx2);cursor:pointer;border-radius:12px 12px 0 0;border:0.5px solid transparent;background:var(--bg2);transition:all .2s;border-bottom:none;-webkit-tap-highlight-color:transparent}
.tab i{font-size:22px}
.tab.t0.active{background:var(--bg);color:var(--pd);border-color:var(--bd)}
.tab.t1.active{background:var(--bg);color:var(--gd);border-color:var(--bd)}
.tab.t2.active{background:var(--bg);color:var(--ad);border-color:var(--bd)}
.tab-count{font-size:10px;background:var(--bg3);border-radius:8px;padding:1px 6px;min-width:18px;text-align:center}
.tab.t0.active .tab-count{background:var(--pl);color:var(--pd)}
.tab.t1.active .tab-count{background:var(--gl);color:var(--gd)}
.tab.t2.active .tab-count{background:var(--al);color:var(--ad)}

/* PANELS */
.panel{display:none;flex-direction:column;border-top:0.5px solid var(--bd)}
.panel.active{display:flex}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:14px 14px}
.kpi{border-radius:12px;padding:12px 14px}
.kpi-n{font-size:28px;font-weight:700;line-height:1}
.kpi-l{font-size:11px;margin-top:3px;opacity:.75}
.kpi.k0{background:var(--pl);color:var(--pd)}
.kpi.k1{background:var(--gl);color:var(--gd)}
.kpi.k2{background:var(--al);color:var(--ad)}
.kpi.k-wait{background:#FFF8E6;color:#7A5500}
.kpi.k-ok{background:#E8F5E9;color:#1b5e20}
.kpi.k-no{background:var(--rl);color:var(--rd)}

/* LIST */
.list-top{display:flex;justify-content:space-between;align-items:center;padding:4px 14px 10px}
.list-top-label{font-size:13px;color:var(--tx2)}
.add-btn{display:flex;align-items:center;gap:5px;border:none;border-radius:24px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;color:#fff;-webkit-tap-highlight-color:transparent}
.add-btn:active{opacity:.8;transform:scale(0.96)}
.a0{background:var(--p)}.a1{background:var(--g)}.a2{background:var(--a)}

/* ENTRIES */
.entries{padding:0 14px 32px;display:flex;flex-direction:column;gap:10px}
.entry-card{background:var(--bg);border:0.5px solid var(--bd);border-radius:18px;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform .1s}
.entry-card:active{transform:scale(0.99)}
.entry-card.done{border-left:3px solid var(--g)}
.entry-card.refused{border-left:3px solid var(--r);opacity:.7}
.card-body{display:flex;align-items:center;gap:12px;padding:14px 14px 10px}
.avatar{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.av0{background:var(--pl)}.av1{background:var(--gl)}.av2{background:var(--al)}
.card-info{flex:1;min-width:0}
.card-name{font-size:15px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:12px;color:var(--tx2);margin-top:3px}
.sp{font-size:10px;font-weight:600;padding:3px 9px;border-radius:12px;white-space:nowrap;flex-shrink:0}
.sp-attente{background:#FFF8E6;color:#7A5500}
.sp-contact{background:var(--pl);color:var(--pd)}
.sp-ok{background:#E8F5E9;color:#1b5e20}
.sp-non{background:var(--rl);color:var(--rd)}
.card-note{padding:0 14px 10px;font-size:12px;color:var(--tx2);font-style:italic;line-height:1.5;border-bottom:0.5px solid var(--bd)}
.card-actions{display:flex}
.ca{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:12px 6px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;-webkit-tap-highlight-color:transparent;transition:background .15s;color:var(--tx2)}
.ca:not(:last-child){border-right:0.5px solid var(--bd)}
.ca:active{background:var(--bg2)}
.ca i{font-size:16px}
.ca.ca-call{color:var(--g)}.ca.ca-mail{color:var(--p)}

/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;padding:48px 24px;gap:10px;color:var(--tx2);text-align:center}
.empty i{font-size:52px;opacity:.15}
.empty p{font-size:14px;line-height:1.7}
.empty-cta{margin-top:6px;font-size:14px;font-weight:600;padding:12px 24px;border-radius:24px;border:none;cursor:pointer;color:#fff}

/* TOAST */
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(10px);background:rgba(0,0,0,.85);color:#fff;padding:10px 22px;border-radius:24px;font-size:14px;z-index:999;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(10px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border-radius:28px 28px 0 0;padding:16px 20px calc(32px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:92vh;overflow-y:auto}
.modal-handle{width:44px;height:4px;background:var(--bd2);border-radius:2px;margin:0 auto 20px}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.modal-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.modal-title{font-size:18px;font-weight:700;color:var(--tx)}
.fg{margin-bottom:14px}
.fl{font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.5px}
.fi{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;font-size:16px;background:var(--bg);color:var(--tx);-webkit-appearance:none;appearance:none;outline:none}
.fi:focus{border-color:var(--p)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.btn-save{flex:1;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;-webkit-tap-highlight-color:transparent}
.bs0{background:var(--p)}.bs1{background:var(--g)}.bs2{background:var(--a)}
.btn-cancel{padding:14px 16px;background:transparent;color:var(--tx2);border:1px solid var(--bd);border-radius:14px;font-size:16px;cursor:pointer}
.btn-del{padding:14px;background:transparent;color:var(--r);border:1px solid var(--rl);border-radius:14px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
</style>
</head>

</div>

<div class="toast" id="toast">Copié !</div>

<div class="modal-overlay" id="modal" onclick="closeIfOut(event)">

    <div class="modal-head"><div class="modal-icon" id="mi"></div><div class="modal-title" id="mt"></div></div>

</div>

function drawWall(t,i){
  const scenes=WALLS[t];
  document.getElementById('hero-svg').innerHTML=scenes[i%scenes.length]();
  document.getElementById('hero-dots').innerHTML=scenes.map((_,j)=>`<div class="hdot${j===i%scenes.length?' active':''}" onclick="manualWall(${j})"></div>`).join('');
}
function manualWall(i){wsi=i;drawWall(ct,i);}
function startTimer(t){
  if(wt)clearInterval(wt);
  if(WALLS[t].length<2)return;
  wt=setInterval(()=>{wsi=(wsi+1)%WALLS[t].length;drawWall(t,wsi);},4500);
}

function updateGlobal(){
  const all=[...data.entreprises,...data.lycees,...data.logements];
  const total=all.length;
  const done=all.filter(e=>e.statut!=='attente').length;
  document.getElementById('hero-badge').textContent=total+' contact'+(total!==1?'s':'');
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('pct-label').textContent=pct+'%';
  document.getElementById('prog-fill').style.width=pct+'%';
  [0,1,2].forEach(i=>document.getElementById('tc-'+i).textContent=data[TC[i].key].length);
}

function renderPanel(t){
  const tk=TC[t].key;
  const items=data[tk];
  const s=items.reduce((a,e)=>{a[e.statut]=(a[e.statut]||0)+1;return a},{});
  let h=`<div class="kpi-row">
    <div class="kpi ${TC[t].kc}"><div class="kpi-n">${items.length}</div><div class="kpi-l">Total</div></div>
    <div class="kpi k-wait"><div class="kpi-n">${s.attente||0}</div><div class="kpi-l">En attente</div></div>
    <div class="kpi k-ok"><div class="kpi-n">${s.ok||0}</div><div class="kpi-l">Accordés</div></div>
    <div class="kpi k-no"><div class="kpi-n">${s.non||0}</div><div class="kpi-l">Refus</div></div>
  </div>
  <div class="list-top"><span class="list-top-label">${items.length} ${items.length===1?TC[t].label:TC[t].label+'s'}</span>
  <button class="add-btn ${TC[t].ac}" onclick="openModal(${t})"><i class="ti ti-plus"></i>Ajouter</button></div>
  <div class="entries">`;
  if(!items.length){
    const msgs=['Aucune entreprise encore.\nChaque appel te rapproche du oui !','Aucun lycée encore.\nLe stage de tes rêves t\'attend !','Aucun logement encore.\nTon chez-toi t\'attend !'];
    h+=`<div class="empty"><i class="ti ${TC[t].icon}"></i><p>${msgs[t].replace('\n','<br>')}</p>
    <button class="empty-cta ${TC[t].ac}" onclick="openModal(${t})"><i class="ti ti-plus"></i> Ajouter</button></div>`;
  } else {
    items.forEach((e,i)=>{
      const sp=SL[e.statut]||SL.attente;
      const em=emoji(t,e.nom);
      const cc=e.statut==='ok'?' done':e.statut==='non'?' refused':'';
      h+=`<div class="entry-card${cc}" onclick="openModal(${t},${i})">
        <div class="card-body">
          <div class="avatar ${TC[t].av}">${em}</div>
          <div class="card-info">
            <div class="card-name">${e.nom}</div>
            <div class="card-meta">${[e.ville,e.secteur].filter(Boolean).join(' · ')||'&nbsp;'}</div>
          </div>
          <div class="sp ${sp.c}">${sp.l}</div>
        </div>`;
      if(e.notes)h+=`<div class="card-note">${e.notes}</div>`;
      const acts=[];
      if(e.tel)acts.push(`<button class="ca ca-call" onclick="callNum('${e.tel}',event)"><i class="ti ti-phone"></i>Appeler</button>`);
      if(e.email)acts.push(`<button class="ca ca-mail" onclick="cpyMail('${e.email}',event)"><i class="ti ti-mail"></i>Copier email</button>`);
      acts.push(`<button class="ca" onclick="openModal(${t},${i})"><i class="ti ti-edit"></i>Modifier</button>`);
      h+=`<div class="card-actions">${acts.slice(0,3).join('')}</div></div>`;
    });
  }
  h+=`</div>`;
  document.getElementById('panel-'+t).innerHTML=h;
  updateGlobal();
}

function switchTab(t){
  ct=t;wsi=0;
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',i===t));
  document.querySelectorAll('.panel').forEach((el,i)=>el.classList.toggle('active',i===t));
  drawWall(t,0);startTimer(t);
}

function openModal(t,idx){
  ct=t;ei=idx!==undefined?idx:-1;
  document.getElementById('mt').textContent=ei>=0?'Modifier':'Nouveau '+TC[t].label;
  const mi=document.getElementById('mi');
  mi.style.cssText=`width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:${TC[t].lclr}`;
  mi.innerHTML=`<i class="ti ${TC[t].icon}" style="color:${TC[t].dclr}"></i>`;
  document.getElementById('mb').innerHTML=FORMS[t];
  document.getElementById('bsave').className='btn-save '+TC[t].bs;
  document.getElementById('bdel').style.display=ei>=0?'flex':'none';
  if(ei>=0){
    const e=data[TC[t].key][ei];
    ['nom','ville','email','tel','contact','secteur','statut','notes'].forEach(k=>{const el=document.getElementById('f-'+k);if(el)el.value=e[k]||'';});
  }
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function closeIfOut(e){if(e.target===document.getElementById('modal'))closeModal();}
function saveEntry(){
  const entry={};
  ['nom','ville','email','tel','contact','secteur','statut','notes'].forEach(k=>{const el=document.getElementById('f-'+k);if(el)entry[k]=el.value.trim();});
  if(!entry.nom){document.getElementById('f-nom').focus();return;}
  if(ei>=0)data[TC[ct].key][ei]=entry;else data[TC[ct].key].push(entry);
  persist();renderPanel(ct);closeModal();
}
function delEntry(){
  if(!confirm('Supprimer cette entrée ?'))return;
  data[TC[ct].key].splice(ei,1);persist();renderPanel(ct);closeModal();
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function callNum(tel,e){e.stopPropagation();window.location.href='tel:'+tel.replace(/\s/g,'');}
function cpyMail(v,e){e.stopPropagation();navigator.clipboard.writeText(v).then(()=>showToast('Email copié !')).catch(()=>showToast(v));}

[0,1,2].forEach(t=>renderPanel(t));
drawWall(0,0);startTimer(0);
</script>
